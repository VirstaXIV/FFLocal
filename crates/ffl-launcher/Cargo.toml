[package]
name = "ffl-launcher"
description = "FFLocal launcher: a small window that checks the game installs and the basic settings, then starts (building first when run from a source checkout)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fflocal"
path = "src/main.rs"

[dependencies]
ffl-core.workspace = true
ffl-hub.workspace = true
# The engines' install locators only (no rendering, no Bevy).
ffl-ff14-assets.workspace = true
ffl-ff11.workspace = true
# glow backend: far lighter to build than the wgpu one, and a settings window needs no more.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui.workspace = true
rfd = "0.16"
anyhow.workspace = true
# Verification aid only: `FFL_LAUNCHER_SCREENSHOT=<png>` saves the window and quits.
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3.4.1", default-features = false, features = ["rustls", "json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
semver = "1.0.28"
serde.workspace = true
serde_json.workspace = true
